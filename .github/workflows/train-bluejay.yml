name: Train Lilguy v0.3 — story-capable custom model

on:
  workflow_dispatch:
    inputs:
      steps:
        description: Training steps
        required: true
        default: "3000"
        type: string
      conversations:
        description: Public dialogue examples
        required: true
        default: "3000"
        type: string
      stories:
        description: Public short-story examples
        required: true
        default: "3000"
        type: string

permissions:
  contents: write

jobs:
  train-bluejay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install training dependencies
        run: pip install -r requirements.txt
      - name: Train Bluejay from random initialization
        run: >-
          python train_bluejay.py
          --steps "${{ inputs.steps }}"
          --conversations "${{ inputs.conversations }}"
          --stories "${{ inputs.stories }}"
          --threads 2
      - name: Publish model checkpoint and training log
        uses: actions/upload-artifact@v4
        with:
          name: Lilguy-v0.3-story-trained
          path: |
            checkpoints/RC-Lilguy-Bluejay.pt
            checkpoints/bluejay_tokenizer.json
            logs/bluejay_training.jsonl
          if-no-files-found: error
      - name: Commit trained weights and tokenizer
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add checkpoints/RC-Lilguy-Bluejay.pt checkpoints/bluejay_tokenizer.json logs/bluejay_training.jsonl data/bluejay_conversations.jsonl data/bluejay_stories.jsonl
          git commit -m "Train Lilguy v0.3 story model" || echo "No checkpoint changes to commit"
          git push
