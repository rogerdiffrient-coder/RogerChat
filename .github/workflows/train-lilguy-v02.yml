name: Train RC Lilguy v0.2

on:
  push:
    branches: [main]
    paths:
      - 'train_v02.py'
      - '.github/workflows/train-lilguy-v02.yml'
  workflow_dispatch:
    inputs:
      stories:
        description: "TinyStories examples for the context-cache model"
        required: true
        default: "800"
        type: choice
        options: ["200", "800", "1200", "2000"]
      max_order:
        description: "Maximum context length (higher uses more memory)"
        required: true
        default: "5"
        type: choice
        options: ["3", "4", "5"]

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out RogerChat
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Train context-cache model (no PyTorch required)
        env:
          STORIES: ${{ inputs.stories }}
          MAX_ORDER: ${{ inputs.max_order }}
        run: |
          STORIES="${STORIES:-800}"
          MAX_ORDER="${MAX_ORDER:-5}"
          echo "Training with stories=$STORIES, max_order=$MAX_ORDER"
          python train_v02.py --stories "$STORIES" --max-order "$MAX_ORDER"
      - name: Publish checkpoint for automatic browser loading
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f checkpoints/RC-Lilguy-v0.2.json
          git commit -m "Publish RC Lilguy v0.2 browser checkpoint" || echo "Checkpoint unchanged"
          git push
      - name: Upload v0.2 model
        uses: actions/upload-artifact@v4
        with:
          name: RC-Lilguy-v0.2-checkpoint
          path: checkpoints/RC-Lilguy-v0.2.json
          if-no-files-found: error
          retention-days: 7
